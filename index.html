<!DOCTYPE html>
<html lang="fr" data-theme="night">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="ChessDuck — Notation FIDE, Académie en 113 leçons, 150 000 problèmes Lichess, Jeu Libre avec Stockfish 19 Lite WASM et Mode Enfant, 100 % hors-ligne.">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ChessDuck">
    <title>ChessDuck</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('chessduck_v2_settings');
                var st = raw ? JSON.parse(raw) : {};
                var kid = Boolean(st.kidMode);
                var tm = typeof st.themeMode === 'number' ? st.themeMode : 2;
                var pal = typeof st.palette === 'number' && st.palette >= 0 && st.palette < 5 ? st.palette : 0;
                var dark = !kid && (tm === 2 || (tm === 0 && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
                var nightBg = ['#0F172A', '#13111C', '#1C1612', '#121316', '#0C1424'];
                var nightFg = ['#F8FAFC', '#F5F3FF', '#FAF3E8', '#F4F4F5', '#F0F6FC'];
                var dayBg = ['#F8FAFC', '#FAF8FF', '#FBF7F0', '#FAFAFA', '#F5F8FC'];
                var dayFg = ['#0F172A', '#1E1B2E', '#261C14', '#18181B', '#0C1929'];
                var bg = kid ? '#EBF6FF' : (dark ? nightBg[pal] : dayBg[pal]);
                var fg = kid ? '#1F3B57' : (dark ? nightFg[pal] : dayFg[pal]);
                var root = document.documentElement;
                root.dataset.theme = kid ? 'kid' : (dark ? 'night' : 'day');
                root.style.setProperty('--bg', bg);
                root.style.setProperty('--text', fg);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', bg);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./src/app.js"></script>
</body>
</html>
