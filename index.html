<!DOCTYPE html>
<html lang="fr" data-theme="night">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="ChessDuck — Notation FIDE, Académie en 113 leçons, 150 000 problèmes Lichess, Jeu Libre avec Stockfish 19 Lite WASM et Mode Enfant, 100 % hors-ligne.">
    <meta name="theme-color" content="#0F172A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ChessDuck">
    <title>ChessDuck</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('chessduck_v2_settings');
                var st = raw ? JSON.parse(raw) : {};
                var kid = Boolean(st.kidMode);
                var tm = (st.themeMode === 0 || st.themeMode === 1 || st.themeMode === 2) ? st.themeMode : 2;
                var pal = Number.isInteger(st.palette) && st.palette >= 0 && st.palette < 5 ? st.palette : 0;
                var dark = !kid && (tm === 2 || (tm === 0 && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
                var nightBg = ['#0F172A', '#120F24', '#17110D', '#121214', '#0F172A'];
                var nightFg = ['#F8FAFC', '#F8FAFC', '#FBF5EF', '#FAFAFA', '#F8FAFC'];
                var dayBg = ['#F8FAFC', '#F8F6FE', '#FBF7F2', '#F7F7F8', '#F8FAFC'];
                var dayFg = ['#0F172A', '#1E1538', '#24170F', '#18181B', '#0F172A'];
                var bg = kid ? '#EBF6FF' : (dark ? nightBg[pal] : dayBg[pal]);
                var fg = kid ? '#1F3B57' : (dark ? nightFg[pal] : dayFg[pal]);
                var root = document.documentElement;
                var ua = navigator.userAgent || '';
                var isIos = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
                var standalone = Boolean(window.navigator && window.navigator.standalone)
                    || Boolean(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
                if (isIos) {
                    root.classList.add('is-ios');
                    if (standalone) {
                        var vp = document.querySelector('meta[name="viewport"]');
                        if (vp) {
                            var content = vp.getAttribute('content') || '';
                            if (!/viewport-fit=/i.test(content)) {
                                vp.setAttribute('content', content + ', viewport-fit=cover');
                            }
                        }
                    }
                }
                root.dataset.theme = kid ? 'kid' : (dark ? 'night' : 'day');
                root.style.colorScheme = (kid || !dark) ? 'light' : 'dark';
                root.style.setProperty('--bg', bg);
                root.style.setProperty('--text', fg);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', bg);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./src/app.js"></script>
</body>
</html>
